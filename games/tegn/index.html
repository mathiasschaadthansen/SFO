<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tegn og pusl</title>
<meta name="theme-color" content="#e5d3ae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#e5d3ae;color:#5e4a3a;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:none;
  }
  #spil{display:block;position:absolute;inset:0;touch-action:none}

  #overlay{
    position:absolute;inset:0;z-index:10;
    display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;
    background:rgba(229,211,174,.9);
    padding:20px;
  }
  #overlay[hidden]{display:none}

  .kort{
    width:min(460px,100%);
    display:flex;flex-direction:column;gap:12px;
    background:#f8f1e6;color:#6b5545;
    border:0;border-radius:34px;
    box-shadow:0 16px 34px rgba(107,85,68,.24),inset 0 3px 0 rgba(255,255,255,.9);
    padding:26px;
    text-align:center;
  }
  .kort h2{margin:0;font-size:34px;font-weight:800;color:#7d6553}
  .kort{margin:auto;flex:0 0 auto}
  .hjaelp{margin:0 0 4px;font-size:16px;font-weight:600;opacity:.72}

  .raekke{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}

  .knap{
    font:inherit;font-weight:800;font-size:22px;
    padding:15px 20px;
    background:#efe3d0;color:#6b5545;
    border:0;border-radius:22px;
    box-shadow:0 6px 0 rgba(107,85,68,.18),0 10px 18px rgba(107,85,68,.18),inset 0 3px 0 rgba(255,255,255,.85);
    cursor:pointer;text-decoration:none;display:block;
    transition:transform .08s,box-shadow .08s;
  }
  .knap:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(107,85,68,.18),0 4px 10px rgba(107,85,68,.16),inset 0 2px 0 rgba(255,255,255,.7)}
  .knap:focus-visible{outline:4px solid #9bbb90;outline-offset:4px}
  .knap.gul{background:#f3c3a4}
  .knap.smal{flex:1 1 auto;font-size:17px;padding:11px 14px}
  .knap.smal.valgt{background:#aed3e4;color:#5a6f7a}
  .knap.lille{font-size:17px;padding:10px 14px;box-shadow:0 4px 0 rgba(107,85,68,.14);opacity:.8}
  .knap.stor{font-size:28px;padding:18px 24px}
  .knap.ikon{display:flex;align-items:center;justify-content:center;padding:10px 14px}
  .knap.ikon svg{display:block}
  .raekke.bund{justify-content:center;margin:6px 0 0}

  /* Vaelg din bil */
  .kort.bred{width:min(780px,100%)}
  .valg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .spiller{
    flex:1 1 260px;display:flex;flex-direction:column;gap:10px;align-items:center;
    padding:12px;border:0;border-radius:24px;background:#fffaf0;box-shadow:0 8px 18px rgba(107,85,68,.16),inset 0 2px 0 rgba(255,255,255,.9);
  }
  canvas.eksempel{width:150px;height:90px;align-self:center}
  .former{display:flex;gap:8px}
  .form{
    width:64px;height:48px;padding:0;
    border:0;border-radius:16px;background:#f8f1e6;
    box-shadow:0 5px 0 rgba(107,85,68,.16),inset 0 2px 0 rgba(255,255,255,.85);cursor:pointer;
  }
  .form.valgt{background:#aed3e4;transform:translateY(3px);box-shadow:0 2px 0 rgba(107,85,68,.16)}
  .form canvas{width:100%;height:100%;display:block}
  .farver{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .farve{
    width:46px;height:46px;border-radius:50%;padding:0;
    border:0;box-shadow:0 4px 9px rgba(107,85,68,.2);cursor:pointer;
  }
  .farve.valgt{outline:4px solid #9bbb90;outline-offset:3px}
  .farve.optaget{opacity:.2;cursor:default}

  /* Overlayet ruller selv, og kortet centreres med margin:auto. Saa kan kortet aldrig
     ende uden for skaermen: 100vh paa iOS er hoejere end det synlige felt, og et kort
     med max-height i vh fjedrede tilbage, naar man proevede at rulle ned til knappen. */
  .baner{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .bane{
    min-width:0;overflow:hidden;
    padding:5px 5px 4px;font:inherit;font-weight:800;font-size:14px;color:#6b5545;
    background:#f8f1e6;border:0;border-radius:20px;box-shadow:0 5px 0 rgba(107,85,68,.16),0 8px 16px rgba(107,85,68,.16);cursor:pointer;
  }
  .bane.valgt{background:#aed3e4;color:#5a6f7a;transform:translateY(3px);box-shadow:0 2px 0 rgba(107,85,68,.16)}
  .bane span{display:block;margin-top:2px}
  .raekke.start{margin-bottom:0}
  .raekke.start .knap{flex:1 1 0}

  /* Lave skaerme (telefon paa siden): alt skal kunne ses uden at rulle */
  @media (max-height:520px){
    #overlay{padding:8px 66px}   /* luft til hjem-knappen i hjoernet, saa den ikke ligger oven paa kortet */
    .kort{padding:12px 16px;gap:7px;width:min(780px,100%);border-radius:22px}
    .kort h2{font-size:22px}
    .hjaelp{display:none}
    .knap{font-size:17px;padding:9px 14px;border-radius:16px}
    .knap.stor{font-size:20px;padding:11px 16px}
    .knap.smal{padding:7px 10px}
    .knap.lille{padding:6px 12px}
    .raekke{margin-bottom:0}
    .spiller{padding:8px;gap:6px}
    .spiller canvas.eksempel{display:none !important}
    .farve{width:36px;height:36px}
    .form{width:58px;height:42px}
    .gitter,.gitter.tal{grid-template-columns:repeat(10,1fr);gap:5px}
    .baner{grid-template-columns:repeat(4,1fr)}
    .bane span{display:none}
    .raekke.to .knap{flex-direction:row;justify-content:center}
  }

  @media (prefers-reduced-motion:reduce){.knap{transition:none}}
</style>
</head>
<body>

<canvas id="spil"></canvas>
<div id="overlay" hidden></div>

<script src="../../js/skal.js"></script>
<script src="../../js/menu.js"></script>
<script src="../bogstaver/js/spor.js"></script>
<script src="js/figurer.js"></script>
<script src="js/pusle.js"></script>
<script src="js/game.js"></script>
</body>
</html>
