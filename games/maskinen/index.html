<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nøddeskoven</title>
<meta name="theme-color" content="#e5d3ae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<style>
  /* Ler-stil: ingen sorte streger, bloede skygger, daempede pasteller.
     Farverne er de samme som i js/figurer.js, saa menu og bane hoerer sammen. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#e5d3ae;color:#5e4a3a;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:none;
  }
  #spil{display:block;position:absolute;inset:0;touch-action:none}

  #overlay{
    position:absolute;inset:0;z-index:10;
    display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;
    background:rgba(229,211,174,.9);
    padding:20px;
  }
  #overlay[hidden]{display:none}

  .kort{
    width:min(460px,100%);
    display:flex;flex-direction:column;gap:14px;
    background:#f8f1e6;color:#6b5545;
    border:0;border-radius:34px;
    box-shadow:0 16px 34px rgba(107,85,68,.24),inset 0 3px 0 rgba(255,255,255,.9);
    padding:26px;
    text-align:center;
  }
  .kort.bred{width:min(780px,100%)}
  .kort h2{margin:0;font-size:32px;font-weight:800;color:#7d6553}
  .kort{margin:auto;flex:0 0 auto}
  .hjaelp{margin:0 0 4px;font-size:16px;font-weight:600;opacity:.6}
  .raekke{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
  .raekke.bund{justify-content:center;margin:6px 0 0}

  /* Knapper er klodser af ler: bloed skygge under, lys kant foroven */
  .knap{
    font:inherit;font-weight:800;font-size:22px;
    padding:16px 20px;
    background:#efe3d0;color:#6b5545;
    border:0;border-radius:22px;
    box-shadow:0 6px 0 rgba(107,85,68,.18),0 10px 18px rgba(107,85,68,.18),inset 0 3px 0 rgba(255,255,255,.85);
    cursor:pointer;text-decoration:none;display:block;
    transition:transform .1s,box-shadow .1s;
  }
  .knap:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(107,85,68,.18),0 4px 10px rgba(107,85,68,.16),inset 0 2px 0 rgba(255,255,255,.7)}
  .knap:focus-visible{outline:4px solid #9bbb90;outline-offset:4px}
  .knap.gul{background:#f3c3a4}
  .knap.smal{flex:1 1 auto;font-size:17px;padding:12px 14px}
  .knap.smal.valgt{background:#aed3e4;color:#5a6f7a}
  .knap.lille{font-size:17px;padding:11px 14px;box-shadow:0 4px 0 rgba(107,85,68,.14);opacity:.8}
  .knap.stor{font-size:28px;padding:18px 24px}
  .knap.ikon{display:flex;align-items:center;justify-content:center;padding:11px 14px}
  .knap.ikon svg{display:block}

  /* Startknappen er groen — men salviegroen, ikke neon. Skal staa efter menu.js. */
  #overlay .knap.groen{background:#8fae86;color:#f8f1e6;box-shadow:0 6px 0 rgba(95,127,88,.4),0 10px 18px rgba(107,85,68,.2),inset 0 3px 0 rgba(255,255,255,.4)}
  #overlay .knap.groen:active{box-shadow:0 2px 0 rgba(95,127,88,.4),0 4px 10px rgba(107,85,68,.16)}
  #overlay .knap.groen.valgt{background:#87b3c9}
  #overlay .raekke.valg .knap{box-shadow:0 5px 0 rgba(107,85,68,.16),inset 0 2px 0 rgba(255,255,255,.8);border:0}
  #overlay .raekke.valg .knap.valgt{background:#aed3e4;transform:translateY(3px);box-shadow:0 2px 0 rgba(107,85,68,.16)}

  /* Banerne: hver vises som et lille billede af sig selv */
  .baner{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .baner.kapitler{grid-template-columns:repeat(5,1fr);margin-bottom:4px}
  .flise.kapitel{aspect-ratio:3/2}
  .flise{
    aspect-ratio:3/2;padding:0;
    border:0;border-radius:18px;background:#f8f1e6;
    box-shadow:0 5px 0 rgba(107,85,68,.14),0 8px 16px rgba(107,85,68,.16);
    cursor:pointer;overflow:hidden;
  }
  .flise.valgt{box-shadow:0 0 0 4px #9bbb90,0 5px 0 rgba(107,85,68,.14),0 8px 16px rgba(107,85,68,.16);transform:translateY(2px)}
  .flise canvas{width:100%;height:100%;display:block}

  /* Overlayet ruller selv, og kortet centreres med margin:auto, saa knappen i
     bunden aldrig kan ende uden for skaermen paa iOS. */
  .raekke.start{margin-bottom:0}
  .raekke.start .knap{flex:1 1 0}

  /* Lave skaerme (telefon paa siden): alt skal kunne ses uden at rulle */
  @media (max-height:520px){
    #overlay{padding:8px 66px}   /* luft til hjem-knappen i hjoernet */
    .kort{padding:14px 18px;gap:8px;width:min(780px,100%);border-radius:26px}
    .kort h2{font-size:22px}
    .hjaelp{display:none}
    .knap{font-size:17px;padding:10px 14px;border-radius:16px}
    .knap.stor{font-size:20px;padding:11px 16px}
    .knap.smal{padding:8px 10px}
    .knap.lille{padding:7px 12px}
    .raekke{margin-bottom:0}
    .baner{grid-template-columns:repeat(6,1fr);gap:7px}
    .baner.kapitler{grid-template-columns:repeat(5,1fr)}
  }

  @media (prefers-reduced-motion:reduce){.knap{transition:none}}
</style>
</head>
<body>

<canvas id="spil"></canvas>
<div id="overlay" hidden></div>

<script src="../../js/skal.js"></script>
<script src="../../js/menu.js"></script>
<script src="js/figurer.js"></script>
<script src="js/fysik.js"></script>
<script src="js/game.js"></script>
</body>
</html>
