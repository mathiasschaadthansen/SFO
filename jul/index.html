<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pelles julekalender</title>
<meta name="theme-color" content="#aed3e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" href="../icons/icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:#e5d3ae;color:#5e4a3a;
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:none;
  }
  #scene{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  /* ---------- kalenderen: lagerne og puslespillet (overlayet er "menuen", pilen i hjoernet foerer hertil) ---------- */
  #overlay{position:absolute;inset:0;z-index:10;background:#aed3e4;overflow:hidden}
  #overlay[hidden]{display:none}
  #kalender{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #overlay h2{
    position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);margin:0;
    padding:6px 22px 7px;border-radius:18px;background:rgba(248,241,230,.88);
    font-size:24px;font-weight:800;color:#7d6553;white-space:nowrap;pointer-events:none;
    box-shadow:0 5px 0 rgba(107,85,68,.14),inset 0 2px 0 rgba(255,255,255,.85);
  }

  /* ---------- knapperne: samme kort som i alle spillene ---------- */
  .knap{
    font:inherit;font-weight:800;font-size:22px;
    padding:12px;background:#efe3d0;color:#6b5545;
    border:0;border-radius:24px;
    box-shadow:0 6px 0 rgba(107,85,68,.18),0 10px 18px rgba(107,85,68,.18),inset 0 3px 0 rgba(255,255,255,.85);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .08s,box-shadow .08s;
  }
  .knap:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(107,85,68,.18),0 4px 10px rgba(107,85,68,.16),inset 0 2px 0 rgba(255,255,255,.7)}
  .knap svg{display:block;width:60%;height:60%}
  .knap.lille{width:52px;height:52px;border-radius:18px;padding:0;opacity:.85}
  #lydknap{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:2}

  /* ---------- historien: billedet, undertekst og de store knapper ---------- */
  #styring{position:absolute;z-index:5;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:16px;align-items:center}
  #styring[hidden]{display:none}
  #styring .knap{width:88px;height:88px;border-radius:28px;padding:0}
  #styring .knap.groen{background:#8fae86;box-shadow:0 6px 0 rgba(95,127,88,.4),0 10px 18px rgba(107,85,68,.2),inset 0 3px 0 rgba(255,255,255,.4)}
  .prikker{display:flex;gap:9px;justify-content:center;padding-top:4px}
  .prikker i{width:16px;height:16px;border-radius:50%;border:2px solid #5e4a3a;background:rgba(248,241,230,.7)}
  .prikker i.her{background:#f0c46a}
  .prikker i.set{background:#d9ba8a}

  /* Underteksten er til den voksne; boernene skal ikke laese. En papirstrimmel under billedet. */
  #undertekst{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;
    padding:8px 22px;border-radius:14px;background:#f8f1e6;
    box-shadow:0 5px 0 rgba(107,85,68,.14),0 8px 16px rgba(107,85,68,.14),inset 0 2px 0 rgba(255,255,255,.85);
    font-size:19px;line-height:1.3;font-weight:600;color:#6b5545;text-align:center;pointer-events:none}
  #undertekst[hidden]{display:none}
  #undertekst p{margin:0}

  @media (max-height:520px){
    #styring{gap:9px}
    #styring .knap{width:60px;height:60px;border-radius:20px}
    #undertekst{font-size:14px;padding:5px 12px}
    #overlay h2{font-size:17px;padding:4px 14px}
    .prikker i{width:11px;height:11px}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="undertekst" hidden><p id="linje"></p></div>
<div id="styring" hidden>
  <button class="knap" id="tilbage" type="button" aria-label="Forrige afsnit"></button>
  <button class="knap groen" id="pause" type="button" aria-label="Pause"></button>
  <button class="knap" id="frem" type="button" aria-label="Næste afsnit"></button>
  <div class="prikker" id="prikker"></div>
</div>
<div id="overlay">
  <canvas id="kalender"></canvas>
  <h2>Pelles julekalender</h2>
  <button class="knap lille" id="lydknap" type="button" aria-label="Lyd til eller fra"></button>
</div>

<script src="../js/skal.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/stemme.js"></script>
<script src="../games/bogstaver/js/glyffer.js"></script>
<script src="../games/bogstaver/js/spor.js"></script>
<script src="../games/bogstaver/js/ting.js"></script>
<script src="../games/rim/js/rim.js"></script>
<script src="js/kalender.js"></script>
<script src="js/puslespil.js"></script>
<script src="js/opgaver.js"></script>
<script src="js/maleri.js"></script>
<script src="js/lege.js"></script>
<script src="js/game.js"></script>
</body>
</html>
